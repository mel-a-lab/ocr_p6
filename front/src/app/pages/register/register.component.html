<!-- Navbar visible on desktop -->
<app-nav-bar-landing class="desktop-nav"></app-nav-bar-landing>

<div class="register-container">
  <!-- Back Button (visible always) -->
  <button class="back-btn" routerLink="/">
    &#8592;
  </button>

  <!-- Logo (visible only on mobile) -->
  <img src="assets/logo_p6.png" alt="Logo" class="logo" />

  <div class="form-wrapper">
    <h1 class="title">Inscription</h1>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- Username -->
      <div class="form-group">
        <label for="username" class="form-label">Nom d'utilisateur</label>
        <input type="text" id="username" formControlName="username" class="form-input">
        <small class="error" *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
          Nom d'utilisateur requis
        </small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email" class="form-label">Adresse e-mail</label>
        <input type="email" id="email" formControlName="email" class="form-input">
        <small class="error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Veuillez entrer un e-mail valide
        </small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" id="password" formControlName="password" class="form-input">
        <small class="error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Mot de passe requis (min 6 caractères)
        </small>
      </div>

      <!-- Error message from server -->
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

      <!-- Submit button -->
      <button type="submit" class="submit-btn" [disabled]="registerForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Inscription en cours...' : "S'inscrire" }}
      </button>
    </form>
  </div>
</div>
